name: SingleStore Driver Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: singlestore-driver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish driver JAR
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Build SingleStore driver
        run: ./bin/build-driver.sh singlestore

      - name: Verify SingleStore driver
        run: clojure -X:build:build/verify-driver :driver :singlestore

      - name: Confirm JAR artifact exists
        run: test -f resources/modules/singlestore.metabase-driver.jar

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          gh release create "${TAG}" \
            --title "SingleStore Metabase Driver v${VERSION}" \
            --generate-notes \
            "resources/modules/singlestore.metabase-driver.jar"
