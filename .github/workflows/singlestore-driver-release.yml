name: SingleStore Driver Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  actions: read

concurrency:
  group: singlestore-driver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # TODO: Add a SingleStore integration test job before publishing the JAR.
  release:
    name: Build and publish driver JAR
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '$TAG' must match vX.Y.Z or vX.Y.Z-<pre-release> (e.g. v1.0.0 or v1.0.0-alpha.1)"
            exit 1
          fi

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Build SingleStore driver
        run: ./bin/build-driver.sh singlestore

      - name: Verify SingleStore driver
        run: clojure -X:build:build/verify-driver :driver :singlestore

      - name: Confirm JAR artifact exists
        run: test -f resources/modules/singlestore.metabase-driver.jar

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PRERELEASE_ARGS=()
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi
          gh release create "${TAG}" \
            --title "SingleStore Metabase Driver v${VERSION}" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}" \
            "resources/modules/singlestore.metabase-driver.jar"
